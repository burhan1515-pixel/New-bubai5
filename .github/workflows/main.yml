
name: Extract ZIP Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Extract ZIP File
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          cp -a extracted/. .
          rm -rf extracted
          rm -f "$ZIP_FILE"

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- .github/workflows/main.yml
          git reset -- .github/workflows/build.yml || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract and update project files"
            git push
          fi
